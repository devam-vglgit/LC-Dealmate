services:
  dealmate:
    build: .
    ports:
      - "8101:8101"
    env_file:
      - backend/.env
    environment:
      # On cms-uat-net, Postgres is reached by container name. Disable docker fallbacks.
      CMS_PG_DOCKER: ""
      CMS_API_DOCKER: ""
    volumes:
      - dealmate-data:/app/backend/data
    networks:
      - cms-uat-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/api/health')",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s

volumes:
  dealmate-data:

networks:
  cms-uat-net:
    external: true
    name: cms-uat-net
