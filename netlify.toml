# Netlify serves the React frontend only. The FastAPI backend cannot run here —
# it is a long-lived Python server with streaming responses, so it needs its own
# host (Render, Railway, Fly.io, a VM…). Point the frontend at it by setting
# VITE_API_BASE in Netlify's build environment.

[build]
  # The app is in a subfolder; without this Netlify builds the repo root and
  # publishes nothing, which is what produces "Page not found".
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route must fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
